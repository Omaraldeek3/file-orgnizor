[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-file-organizer"
version = "1.0.0"
description = "Local-first Arabic and English design-file organizer"
requires-python = ">=3.11"
dependencies = ["PySide6==6.11.2", "RapidFuzz==3.14.6", "Unidecode==1.4.0"]

[project.optional-dependencies]
dev = ["pytest>=8.4,<10", "ruff>=0.12,<1"]

[project.gui-scripts]
smart-file-organizer = "smart_organizer.app:main"

[tool.setuptools.packages.find]
include = ["smart_organizer*"]

[tool.setuptools.package-data]
smart_organizer = ["*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
